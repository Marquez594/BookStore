<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BookStore</title>
        <link rel="icon" type="image/png" href="#">
        <link rel="stylesheet" href="index.css">

    </head>
    <body>
          <header>
            <div class="headerDiv" id="promo">
                <p><img src="#" alt="some Pic"> free Books</p>
            </div>
            <div class="main-header">
                <h3>BookStore Logo</h3>
                <form id="search">
                    <input type="text" placeholder="Search by Title, Author, ISBN" name="query">
                    <button type="submit"><img src="image/mag.png" alt="search"></button>

                </form>
                <ul>
                    <li><a href="#"> <img id="cart"src="image/cart.jpg" alt="cart"></a></li>
                    <li><a href="#">SignIn</a></li>
                </ul>
            </div>
            
                <nav id="menu">
                    <ul>
                        <li><a href="#">Best Seller</a></li>
                        <li><a href="#">Fiction</a></li>
                        <li><a href=#>Action</a></li>
                        <li><a href="#">Mystery</a></li>
                    
                    </ul>
                </nav>

            
        </header>
        <main>
            <section id="hero">
                <div id="carousel">
                    <button id="left">&lt</button>
                    <div id="slide">
                        
                        <img id="banner" src="image/elegantLib.jpg" alt="some Pic">
                        <img id="banner2" src="image/banner2.jpg" alt="some Pic">
                        <img id="banner3" src="image/banner3.jpg" alt="some Pic">
                    </div>
                        
                    <button id="right">&gt</button>
                </div>
            </section>
        </main>
        <script src="index.js"></script>
    </body>


</html>
